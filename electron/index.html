<!doctype html>
<html lang="en" class="overscroll-none">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>pilot</title>
  <script>
    // Apply the stored colour scheme before the bundle runs to avoid a flash on load.
    // Mirrors pxd's useColorScheme: key "fe.system.color-scheme", values dark|light|auto.
    (function () {
      try {
        var stored = localStorage.getItem('fe.system.color-scheme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { }
    })();
  </script>
</head>

<body ontouchstart="">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
